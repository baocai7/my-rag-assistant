# 一键起 RAG 应用（可选：加一个向量库练手）
#   docker compose up -d          启动
#   docker compose logs -f        看日志
#   docker compose down           停止并删除容器
#
# 前置：宿主机上 vLLM 跑在 8000 端口
#   docker compose 里的 host.docker.internal 指向宿主机（Docker Desktop 支持）

services:
  rag:
    build: .
    image: my-rag-assistant:latest
    container_name: rag-app
    ports:
      - "6006:6006"
    environment:
      # 指向宿主机上的 vLLM 服务
      VLLM_URL: http://host.docker.internal:8000/v1/chat/completions
      VLLM_MODEL: qwen3.8-27b
      # 由 eval_rag.py 在评测集上校准得出
      SMART_THRESHOLD: "0.48"
      RAG_PORT: "6006"
    volumes:
      # ① 绑定挂载：宿主机的项目目录 = 容器里的 /app
      #    （开发模式，改代码不用重建镜像；pdfs/ 和索引也在这里）
      - .:/app
      # ② 命名卷：embedding 模型缓存，容器重建不用重新下载
      - hf-cache:/models/hf
    restart: unless-stopped

  # ---- 进阶练习：把 numpy 检索换成真正的向量数据库 ----
  # 启用后，容器内用 http://qdrant:6333 访问（服务名即主机名）
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: rag-qdrant
  #   ports:
  #     - "6333:6333"      # Web UI: http://localhost:6333/dashboard
  #   volumes:
  #     - qdrant-data:/qdrant/storage
  #   restart: unless-stopped

volumes:
  hf-cache:
  # qdrant-data:
